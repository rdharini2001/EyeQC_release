[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeqc"
version = "3.0.0"
description = "Interpretable quality assessment for colour fundus photographs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "opencv-python-headless>=4.9,<5",
  "matplotlib>=3.8,<4", "pillow>=10,<13", "joblib>=1.3", "pyarrow>=14", "torch>=2.2,<3", "torchvision>=0.17,<1",
]

[tool.setuptools]
packages = ["eyeqc"]
